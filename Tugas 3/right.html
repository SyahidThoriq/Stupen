<!DOCTYPE html>

    <style>
        body {
            background-color: #111111;
            color: #FFFFFF;

            padding: 10px;
        }
        fieldset {
            border: 2px solid #FFFFFF;
            background-color: #1a1a1a;
        }
        legend {
            background-color: #FFFFFF;
            color: #111111;
            font-family: 'Impact', sans-serif;
            padding: 2px 10px;

        ul { padding-left: 18px; }
        li { margin-bottom: 10px; }
        a {
            color: #E60012;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            color: #111111;

            padding: 2px 4px;
        }

</head>
