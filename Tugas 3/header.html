<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            background-color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .banner-box {
            background-color: #E60012;
            color: #FFFFFF;
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 26px;
            font-style: italic;
            text-transform: uppercase;
            padding: 8px 30px;
            transform: rotate(-2deg);
            border: 4px solid #FFFFFF;
            box-shadow: 6px 6px 0px #000000;
            text-decoration: none;
            display: inline-block;
            letter-spacing: 2px;
        }
        .banner-box span {
            background-color: #FFFFFF;
            color: #111111;
            padding: 2px 8px;
            transform: rotate(2deg);
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- Hyperlink dari Gambar / Banner -->
    <a href="home.html" target="mainFrame" class="banner-box">
        TAKE YOUR <span>HEART</span> - WEB PORTOFOLIO
    </a>
</body>
</html>
