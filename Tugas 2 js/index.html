<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 2 - Data Pegawai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f4f4f4;
        }
        tfoot {
            font-weight: bold;
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

    <h2>Data Pegawai</h2>

    <script>
        // Data Pegawai (Diketahui)
        let nama = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "manajer";
        let status = "menikah";

        // 1. Gaji Pokok (menggunakan if / else if)
        let gapok = 0;
        let jabatanLower = jabatan.toLowerCase();

        if (jabatanLower === "manajer") {
            gapok = 15000000;
        } else if (jabatanLower === "asisten manajer") {
            gapok = 10000000;
        } else if (jabatanLower === "staff") {
            gapok = 5000000;
        } else {
            gapok = 0;
        }

        // 2. Tunjangan Jabatan: 15% dari gapok
        let tunjJabatan = 0.15 * gapok;

        // 3. BPJS: 10% dari gapok
        let bpjs = 0.10 * gapok;

        // 4. Tunjangan Keluarga (menggunakan operator ternary): 20% jika menikah
        let tunjKeluarga = (status.toLowerCase() === "menikah") ? 0.20 * gapok : 0;

        // 5. Total Gaji
        let totalGaji = gapok + tunjJabatan + bpjs + tunjKeluarga;

        // Fungsi format Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(angka);
        }

        // Cetak Tabel
        document.write(`
            <table>
                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunjangan Jabatan (15%)</th>
                        <th>BPJS (10%)</th>
                        <th>Tunjangan Keluarga (20%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${nama}</td>
                        <td>${umur} tahun</td>
                        <td>${jabatan}</td>
                        <td>${status}</td>
                        <td>${formatRupiah(gapok)}</td>
                        <td>${formatRupiah(tunjJabatan)}</td>
                        <td>${formatRupiah(bpjs)}</td>
                        <td>${formatRupiah(tunjKeluarga)}</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="7" style="text-align: right;"><strong>Total Gaji:</strong></td>
                        <td><strong>${formatRupiah(totalGaji)}</strong></td>
                    </tr>
                </tfoot>
            </table>
        `);
    </script>

</body>
</html>
